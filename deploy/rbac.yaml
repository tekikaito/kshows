# kshows is strictly read-only. This ClusterRole contains no write verbs of
# any kind, and never will — the tool has no write code paths.
apiVersion: v1
kind: Namespace
metadata:
  name: kshows
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kshows
  namespace: kshows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kshows-readonly
rules:
  # Core capacity model: node allocatable + pod requests/limits.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # Node-level disk, read from each kubelet directly (kubelet Summary API).
  # The kubelet authorizes /stats/* as nodes/stats: statistics and nothing else.
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  # The same data through the API server proxy, the fallback when pods cannot
  # reach the kubelet port. This grant also reaches the kubelet's exec and run
  # endpoints: drop it if the direct route works, and pass --node-disk=kubelet.
  # Without either rule, kshows degrades to capacity-only disk; pass
  # --node-disk=off so it stops asking.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  # Live CPU/RAM usage from the Metrics Server.
  # Optional: without it, kshows degrades to a requests/limits-only view. If
  # you drop it, also pass --metrics-server=false so kshows stops asking.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kshows-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kshows-readonly
subjects:
  - kind: ServiceAccount
    name: kshows
    namespace: kshows
