# kshows is strictly read-only. This ClusterRole contains no write verbs of
# any kind, and never will — the tool has no write code paths.
apiVersion: v1
kind: Namespace
metadata:
  name: kshows
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kshows
  namespace: kshows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kshows-readonly
rules:
  # Core capacity model: node allocatable + pod requests/limits.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # Node-level disk via the kubelet Summary API (apiserver proxy).
  # Optional: without it, kshows degrades to capacity-only disk.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  # Live CPU/RAM usage from the Metrics Server.
  # Optional: without it, kshows degrades to a requests/limits-only view.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kshows-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kshows-readonly
subjects:
  - kind: ServiceAccount
    name: kshows
    namespace: kshows
