apiVersion: apps/v1
kind: Deployment
metadata:
  name: kshows
  namespace: kshows
  labels:
    app.kubernetes.io/name: kshows
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kshows
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kshows
      annotations:
        # kshows exposes its own operational metrics (poll timing, signal
        # health, SSE clients) — not cluster capacity, which is
        # kube-state-metrics' job.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kshows
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kshows
          # Pinned deliberately: :latest makes a rollout non-reproducible and
          # hides which version a cluster is actually running. Image tags carry
          # no "v" prefix — that lives on the git tag only.
          image: ghcr.io/tekikaito/kshows:0.1.1
          args: ["--listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: kshows
  namespace: kshows
  labels:
    app.kubernetes.io/name: kshows
spec:
  selector:
    app.kubernetes.io/name: kshows
  ports:
    - name: http
      port: 80
      targetPort: http
