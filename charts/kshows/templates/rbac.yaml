{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kshows.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kshows.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Read-only by construction: every verb below is get, list, or watch. kshows
# has no code path that writes to the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kshows.clusterRoleName" . }}
  labels:
    {{- include "kshows.labels" . | nindent 4 }}
rules:
  # Required: the capacity model itself.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.nodesProxy }}
  # Optional: node disk via the kubelet Summary API.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.rbac.metrics }}
  # Optional: live CPU/RAM usage.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kshows.clusterRoleName" . }}
  labels:
    {{- include "kshows.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kshows.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kshows.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
