<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kshows — cluster capacity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='0' y='0' width='9' height='16' rx='2' fill='%233987e5'/%3E%3Crect x='10' y='0' width='6' height='9' rx='2' fill='%23d95926'/%3E%3Crect x='10' y='10' width='6' height='6' rx='2' fill='%23199e70'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">
    <span class="glyph" aria-hidden="true">▚</span>
    <span class="name">kshows</span>
    <span class="tag">cluster capacity</span>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Dimension">
      <button data-dim="cpu" aria-pressed="true">CPU</button>
      <button data-dim="mem" aria-pressed="false">RAM</button>
      <button data-dim="disk" aria-pressed="false">DISK</button>
    </div>
    <div class="seg" role="group" aria-label="Metric">
      <button data-metric="requests" aria-pressed="false">REQUESTS</button>
      <button data-metric="limits" aria-pressed="false">LIMITS</button>
      <button data-metric="actual" aria-pressed="true">ACTUAL</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="clock">—</span>
  </div>
</header>

<div class="banners" id="banners"></div>

<div class="splash" id="splash">waiting for first snapshot…</div>

<main>
  <section class="summary" id="summary" aria-label="Cluster totals"></section>
  <nav class="legend" id="legend" aria-label="Namespace legend"></nav>
  <section class="grid" id="grid" aria-label="Nodes"></section>
</main>

<div class="tooltip" id="tooltip" role="tooltip"></div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Node detail">
    <div class="panel-head">
      <span class="nname"></span>
      <span class="meta"></span>
      <button class="close">ESC · close</button>
    </div>
    <div class="panel-viz"></div>
    <div class="panel-table"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
