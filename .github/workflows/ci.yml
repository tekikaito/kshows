name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test web/static/*.test.mjs

  manifests:
    name: Manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The quickstart is `kubectl apply -f deploy/…` — a typo there breaks
      # every new install, so validate the manifests against the API schemas.
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - run: kubeconform -strict -summary deploy/
      # The chart is a second install path for the same resources; render it
      # and validate the output the same way.
      - uses: azure/setup-helm@v5
      - run: helm lint charts/kshows
      - name: Validate rendered chart (default and degraded RBAC)
        run: |
          helm template kshows charts/kshows | kubeconform -strict -summary -
          helm template kshows charts/kshows \
            --set rbac.nodesProxy=false --set rbac.metrics=false \
            --set ingress.enabled=true --set serviceMonitor.enabled=true \
            | kubeconform -strict -summary -skip ServiceMonitor -
      # Container tags carry no "v" prefix — that belongs to the git tag only.
      # Defaulting the chart's tag from appVersion has pulled a nonexistent
      # image once already; fail here rather than in someone's cluster.
      - name: Chart resolves to a v-less image tag
        run: |
          set -euo pipefail
          ref=$(helm template kshows charts/kshows | grep -oP '(?<=image: ").*(?=")')
          echo "chart resolves to: $ref"
          tag="${ref##*:}"
          case "$tag" in
            v*) echo "::error::image tag '$tag' has a leading v; no such tag is published"; exit 1 ;;
          esac

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
